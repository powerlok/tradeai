services:
  postgres:
    image: postgres:15
    container_name: trading_postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trading
    volumes:
      - trade_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port mapping for Postgres; services use the Docker network
  redis:
    image: redis:7
    container_name: trading_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Redis used internally; avoid binding host port to prevent conflicts with other projects
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: trading_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    init: true
    volumes:
      - ./:/app
      - ./models:/app/models
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:trader@postgres:5432/trading
      - REDIS_URL=redis://redis:6379/0
      - TRADING_MODE=PAPER
      - OLLAMA_URL=http://trading_ollama:11434/api
      - OLLAMA_MODEL=llama3.2:latest
      - OLLAMA_TIMEOUT_SECONDS=30
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=https://api.groq.com
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    command: npm run dev -- --host 0.0.0.0 --port 4173
    restart: unless-stopped
    init: true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
  market_collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: trading_market_collector
    command: python -m app.market.candle_sync
    restart: unless-stopped
    init: true
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:trader@postgres:5432/trading
      - REDIS_URL=redis://redis:6379/0
      - TRADING_MODE=PAPER
      - OLLAMA_URL=http://trading_ollama:11434/api
      - OLLAMA_MODEL=llama3.2:latest
      - OLLAMA_TIMEOUT_SECONDS=30
    depends_on:
      postgres:
        condition: service_healthy
  ws_collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: trading_ws_collector
    command: python -m app.market.ws_collector
    restart: unless-stopped
    init: true
    volumes:
      - ./:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:trader@postgres:5432/trading
      - REDIS_URL=redis://redis:6379/0
      - TRADING_MODE=PAPER
      - OLLAMA_URL=http://trading_ollama:11434/api
      - OLLAMA_MODEL=llama3.2:latest
      - OLLAMA_TIMEOUT_SECONDS=30
    depends_on:
      postgres:
        condition: service_healthy
  model_retrainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: trading_model_retrainer
    command: python -m app.ml.retrain_service
    restart: unless-stopped
    init: true
    cpus: "1.0"
    volumes:
      - ./:/app
      - ./models:/app/models
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:trader@postgres:5432/trading
      - REDIS_URL=redis://redis:6379/0
      - TRADING_MODE=PAPER
      - OLLAMA_URL=http://trading_ollama:11434/api
      - OLLAMA_MODEL=llama3.2:latest
      - OLLAMA_TIMEOUT_SECONDS=30
      - RETRAIN_INTERVAL_SECONDS=21600
      - RETRAIN_MODEL_TYPE=logistic
      - RETRAIN_MIN_TEST_AUC=0.55
    depends_on:
      postgres:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    container_name: trading_ollama
    volumes:
      - ./ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Note: Ensure Ollama is installed and models are provisioned; this image is a placeholder
  mcp_market:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    container_name: trading_mcp_market
    restart: unless-stopped
    init: true
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  trade_postgres_data:
